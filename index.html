<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      var theme = "night";
      try {
        var raw = localStorage.getItem("genshin-books-display-prefs-v1");
        var parsed = raw ? JSON.parse(raw) : null;
        if (parsed && (parsed.theme === "night" || parsed.theme === "paper" || parsed.theme === "sepia")) {
          theme = parsed.theme;
        }
      } catch (e) {
        // Ignore storage errors
      }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) {
        meta.content = theme === "night" ? "dark" : "light";
      }
    })();
  </script>
  <title>テイワット文庫 — 原神 聖遺物・武器・書籍リーダー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body data-view="shelf">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
